SilverStripe\SiteConfig\SiteConfig:
  fonts:
    native-sans-serif: 
      title: Sans Serif (Native)
      type: sans-serif
      family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"
      uses: ["body", "headline"]
    native-serif: 
      title: Serif (Native)
      type: serif
      family: '"Iowan Old Style", "Apple Garamond", Baskerville, "Times New Roman", "Droid Serif", Times, "Source Serif Pro", serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'
      uses: ["body", "headline"]
    native-monospace: 
      title: Monospace (Native)
      type: monospace
      family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace
      uses: ["body", "headline", "monospace"]
    agbalumo:
      title: Agbalumo
      type: cursive
      family: Agbalumo, cursive
      link: https://fonts.googleapis.com/css2?family=Agbalumo&display=swap
      uses: ["headline"]
    alegreya:
      title: Alegreya
      type: serif
      family: Alegreya, serif
      link: https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap
