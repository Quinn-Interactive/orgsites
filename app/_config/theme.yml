---
Name: mytheme
---
SilverStripe\View\SSViewer:
  themes:
    - 'main'
    - '$default'
SilverStripe\i18n\i18n:
  default_locale: 'en_US'
SilverStripe\Forms\HTMLEditor\TinyMCEConfig:
  editor_css:
    - themes/main/dist/css/editor.css
---
Before:
  - '#login-forms'
---
SilverStripe\LoginForms\EnablerExtension:
  login_themes:
    - '$default'
    - 'main'
